[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-verify"
version = "0.1.0"
description = "A tool-using, auditable business analytics agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "duckdb>=1.3",
  "numpy>=2.3",
  "pandas>=2.3",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-dotenv>=1.1",
  "pyyaml>=6",
  "rank-bm25>=0.2.2",
  "sqlglot>=27",
]

[project.optional-dependencies]
agent = [
  "httpx>=0.28",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "openai>=2.0",
]
ui = [
  "fastapi>=0.135",
  "openpyxl>=3.1",
  "plotly>=6.3",
  "python-multipart>=0.0.20",
  "streamlit>=1.48",
  "uvicorn>=0.35",
]
mcp = ["mcp>=2.2,<3"]
science = [
  "openpyxl>=3.1",
  "pandera>=0.26",
  "polars>=1.33",
  "pyarrow>=21",
  "scikit-learn>=1.7",
  "scipy>=1.16",
]
dev = [
  "hypothesis>=6.138",
  "pytest>=8.4",
  "pytest-cov>=6",
  "ruff>=0.12",
]
full = [
  "datapilot-verify[agent,ui,mcp,science,dev]",
]

[project.scripts]
datapilot = "datapilot_verify.cli:main"
datapilot-eval = "datapilot_verify.eval.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
